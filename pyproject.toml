[project]
name = "vigil"
version = "0.1.0"
description = "Multi-object tracking from noisy, simulated sensor data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
]

[project.scripts]
vigil = "vigil.cli:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
